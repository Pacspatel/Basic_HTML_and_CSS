
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First React Project</title>

    <!-- Link to the React library files -->
    <script src="react.js"></script>
    <script src="react-dom.js"></script>
</head>

<body>

    <h1>My First React Project</h1>

    <!-- React will display the timer inside this div -->
    <div id="My_React_Code"></div>

    <script>
        // Create a React component named Counter
        var Counter = React.createClass({
            render: function() {

                // Calculate the time passed
                var time_Passed = Math.round(this.props.time_Passed / 100);

                // Convert the time into seconds
                var seconds_Passed = time_Passed / 10 +
                    (time_Passed % 10 ? '.' : '.0');

                // Create the message displayed on the page
                var text = 'My React code started running ' +
                    seconds_Passed + ' seconds ago!';

                return React.DOM.p(null, text);
            }
        });

        // Create a factory for the Counter component
        var counter_Factory = React.createFactory(Counter);

        // Store the starting time
        var start_Counting = new Date().getTime();

        // Update the timer every 50 milliseconds
        setInterval(function() {
            ReactDOM.render(
                counter_Factory({
                    time_Passed: new Date().getTime() - start_Counting
                }),
                document.getElementById('My_React_Code')
            );
        }, 50);
    </script>

</body>

</html>
